name: Snapcraft Action
author: Samuel Meuli
description: GitHub Action for setting up Snapcraft

inputs:
  channel:
    description: The channel to install Snapcraft from
    required: false
    default: stable
  skip_install:
    description: Skip installation (login only)
    required: false

runs:
  using: node24
  main: ./index.js

branding:
  icon: upload-cloud
  color: green
